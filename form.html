<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        .correct{color:green}
        .wrong{color:red}
    </style>
</head>
<body>
    <form id="registrationForm">
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <br><br>
        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>
        <label for="password">Password: </label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br><br>
        <div id="hiddenpassword" hidden>
            <p id="characterlength">At least 6 characters</p>
            <p id="specialcharacter">Must include a special character (!@#$...)</p>
            <p id="uppercaseletter">Must include an uppercase letter (A-Z)</p>
        </div>
        <button type="submit">Submit</button>
    </form>


    <script>
        const form = document.getElementById("registrationForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            window.location.href = "success.html";
        });

        const passwordInput = document.getElementById('password');
        const passwordRules = document.getElementById('hiddenpassword');

        passwordInput.addEventListener('input', function(){
            passwordRules.hidden = false;

            const password = passwordInput.value;
            const lengthRule = document.getElementById("lengthRule");

            const hasEnoughCharacters = password.length >= 6;

            lengthRule.classList.toggle("valid", hasEnoughCharacters);
            lengthRule.classList.toggle("invalid", !hasEnoughCharacters);

            const specialRule = document.getElementById("specialRule");
            const uppercaseRule = document.getElementById("uppercaseRule");

            const hasSpecialCharacter = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const hasUppercase = /[A-Z]/.test(password);

            specialRule.classList.toggle("valid", hasSpecialCharacter);
            specialRule.classList.toggle("invalid", !hasSpecialCharacter);

            uppercaseRule.classList.toggle("valid", hasUppercase);
            uppercaseRule.classList.toggle("invalid", !hasUppercase);
        })

    </script>
</body>
</html>
