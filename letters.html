<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter L</title>
<style>
.l {
    background-color: orange;
    display: inline-block;
    width: 60px;
    height: 80px;
    position: relative;
}

/* Single cutout covering the top-right quarter */
.cutout {
    background-color: white;
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 60px;
}
</style>
</head>
<body>

<div class="l">
    <div class="cutout"></div>
</div>

</body>
</html>
