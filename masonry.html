<!DOCTYPE html>
<html lang="en">
<head>
    <title>Masonry</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left-panel {
            width: 90px;
            background-color: orange;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            gap: 20px;
            font-size: 28px;
        }

        .right-panel {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            height: 100%;
            overflow-y: auto;
            padding: 4px;
            gap: 4px;
        }

        .right-panel > img {
            height: 180px;
            flex-grow: 1;
            object-fit: cover;
            min-width: 0px;
        }
    </style>
</head>
<body>
    <aside class="left-panel">
        <span>&#x1F4F7;</span>
        <span>&#x1F5C4;&#xfe0f;</span>
        <span>&#x2764;&#xfe0f;</span>
        <span>&#x1F5D1;&#xfe0f;</span>
    </aside>

    <main class="right-panel">
        <img src="https://picsum.photos/102/100" alt="Gallery Photo">
        <img src="https://picsum.photos/105/100" alt="Gallery Photo">
        <img src="https://picsum.photos/206/100" alt="Gallery Photo">
        <img src="https://picsum.photos/354/100" alt="Gallery Photo">
        <img src="https://picsum.photos/304/100" alt="Gallery Photo">
        <img src="https://picsum.photos/169/100" alt="Gallery Photo">
        <img src="https://picsum.photos/269/100" alt="Gallery Photo">
        <img src="https://picsum.photos/369/100" alt="Gallery Photo">
        <img src="https://picsum.photos/341/100" alt="Gallery Photo">
        <img src="https://picsum.photos/242/100" alt="Gallery Photo">
        <img src="https://picsum.photos/101/100" alt="Gallery Photo">
        <img src="https://picsum.photos/109/100" alt="Gallery Photo">
        <img src="https://picsum.photos/321/100" alt="Gallery Photo">
        <img src="https://picsum.photos/167/100" alt="Gallery Photo">
        <img src="https://picsum.photos/267/100" alt="Gallery Photo">
        <img src="https://picsum.photos/289/100" alt="Gallery Photo">
        <img src="https://picsum.photos/307/100" alt="Gallery Photo">
        <img src="https://picsum.photos/399/100" alt="Gallery Photo">
        <img src="https://picsum.photos/299/100" alt="Gallery Photo">
        <img src="https://picsum.photos/199/100" alt="Gallery Photo">
    </main>
</body>
</html>
