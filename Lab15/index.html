<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>


        const api_site = "https://jsonplaceholder.typicode.com/posts";
        const getData = async()=>{
            try{
                let data = await fetch(api_site);
                data = await data.json();
                console.table(data);

                function displayPost(datas) {
                    let art = document.createElement('article');

                    let htwo = document.createElement('h2');
                    htwo.textContent = datas.title;
                    art.appendChild(htwo);

                    let body = document.createElement('p');
                    body.textContent = datas.body;
                    art.appendChild(body);

                    let userID = document.createElement('p');
                    userID.textContent = 'User ID: ' + datas.userId;
                    art.appendChild(userID);

                    let PostID = document.createElement('p');
                    PostID.textContent = 'Post ID: ' + datas.id;
                    art.appendChild(PostID);


                    document.body.appendChild(art);
                }

                for (let datas of data) {
                    displayPost(datas);
                }

                let filter_button = document.getElementById('filterBtn');
                filter_button.addEventListener('click', function () {
                    let user_drop = document.getElementById('userID');
                    let user_select = Number(user_drop.value);

                    for (let datas of data) {
                        if (datas.userId === user_select) {
                        console.log(
                        `Title: ${datas.title} Body: ${datas.body} Post ID: ${datas.id}`
                        );
                        }
                    }
                });

                let display_button = document.getElementById('displayUserBtn');
                display_button.addEventListener('click', function() {
                    document.querySelectorAll('article').forEach((article) =>{
                        article.remove();
                    });

                    let user_input = document.getElementById('displayUserID');
                    let user_select = Number(user_input.value);

                    for (let datas of data) {
                        if (datas.userId === user_select) {
                            displayPost(datas);
                        }
                    }
                });

                let find_button = document.getElementById('findBtn');
                find_button.addEventListener('click', function() {
                    document.querySelectorAll('article').forEach((article) => {
                        article.remove();
                    });

                    let post_input = document.getElementById('postID');
                    let post_select = Number(post_input.value);
                    let found = false;

                    for (let datas of data) {
                        if (datas.id === post_select) {
                            displayPost(datas);
                            found = true;
                        }
                    }

                    if (found === false) {
                        alert("Post not found");
                    }
                });

                




            }catch{(reason)=>console.log(reason)}
        }
        getData();

    </script>

</body>
</html>
